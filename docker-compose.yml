services:
  api:
    build: ./api
    ports:
      - "${API_PORT:-4001}:4001"
    env_file: .env
    environment:
      # ── Servidor ────────────────────────────────────────────────────────────
      - PORT=4000
      - APP_URL=${APP_URL:-https://app.leadsflowapi.com}
      - FRONTEND_URL=${FRONTEND_URL:-}
      # Endereço público da API (links de ficheiros, webhooks, logins da Meta e do Google)
      - API_URL=${API_URL:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,https://app.leadsflowapi.com}
      - APP_TIMEZONE=${APP_TIMEZONE:-Africa/Maputo}
      # ── Segurança (gerar uma vez; nunca mudar a CHANNEL_SECRETS_KEY depois de definida) ──
      - JWT_SECRET=${JWT_SECRET}
      - CHANNEL_SECRETS_KEY=${CHANNEL_SECRETS_KEY:-}
      - DIAGNOSTIC_SECRET=${DIAGNOSTIC_SECRET:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      # ── Base de dados ───────────────────────────────────────────────────────
      - PG_HOST=${PG_HOST}
      - PG_PORT=${PG_PORT:-5432}
      - PG_DATABASE=${PG_DATABASE:-leadflow}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_SSL=${PG_SSL:-false}
      # ── Contas iniciais ─────────────────────────────────────────────────────
      - ALLOW_SETUP=${ALLOW_SETUP:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DEMO_EMAIL=${DEMO_EMAIL:-}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
      - REQUIRE_EMAIL_CONFIRMATION=${REQUIRE_EMAIL_CONFIRMATION:-false}
      # ── Email (SMTP) ────────────────────────────────────────────────────────
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-LeadsFlow API <noreply@leadsflowapi.com>}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-}
      # ── Ficheiros (MinIO) ───────────────────────────────────────────────────
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-true}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_BUCKET=${MINIO_BUCKET:-leadflow-avatars}
      - MINIO_REGION=${MINIO_REGION:-us-east-1}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-}
      - SERVICE_USER_MINIO=${SERVICE_USER_MINIO:-}
      - SERVICE_PASSWORD_MINIO=${SERVICE_PASSWORD_MINIO:-}
      # ── Cópias de segurança (Administração → Cópias de segurança) ───────────
      # Chave das cópias; vazia = usa a CHANNEL_SECRETS_KEY. Guardar fora da VPS: sem ela as cópias não abrem.
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - MINIO_BACKUP_BUCKET=${MINIO_BACKUP_BUCKET:-leadsflow-backups}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      - BACKUP_HOUR_UTC=${BACKUP_HOUR_UTC:-1}
      # Armazenamento fora da VPS (Cloudflare R2: endpoint https://<conta>.r2.cloudflarestorage.com)
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_ACCESS_KEY=${BACKUP_S3_ACCESS_KEY:-}
      - BACKUP_S3_SECRET_KEY=${BACKUP_S3_SECRET_KEY:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-auto}
      # ── Meta (Facebook, Instagram, WhatsApp Business, API de Conversões) ───
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_LOGIN_CONFIG_ID=${META_LOGIN_CONFIG_ID:-}
      - META_WA_CONFIG_ID=${META_WA_CONFIG_ID:-}
      - META_INSTAGRAM_APP_ID=${META_INSTAGRAM_APP_ID:-}
      - META_INSTAGRAM_APP_SECRET=${META_INSTAGRAM_APP_SECRET:-}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:-}
      - META_FACEBOOK_COMMENTS=${META_FACEBOOK_COMMENTS:-true}
      - META_COMMENTS_ENABLED=${META_COMMENTS_ENABLED:-false}
      # ── WhatsApp por código QR (Evolution) ─────────────────────────────────
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      # ── IA dos assistentes ──────────────────────────────────────────────────
      - AI_PROVIDER=${AI_PROVIDER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # ── Voz: ElevenLabs e chamadas do WhatsApp (serviço voice-bridge abaixo) ─
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_DEFAULT_VOICE_ID=${ELEVENLABS_DEFAULT_VOICE_ID:-}
      - WHATSAPP_CALLS_ENABLED=${WHATSAPP_CALLS_ENABLED:-true}
      - VOICE_BRIDGE_URL=http://voice-bridge:8090
      - VOICE_BRIDGE_TOKEN=${VOICE_BRIDGE_TOKEN:-}
      # ── Google: login, Google Drive (base de conhecimento) e Encontrar leads ─
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_PICKER_API_KEY=${GOOGLE_PICKER_API_KEY:-}
      - GOOGLE_PROJECT_NUMBER=${GOOGLE_PROJECT_NUMBER:-}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      # ── Pagamentos (Stripe) ─────────────────────────────────────────────────
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # ── Notificações push (Firebase) ────────────────────────────────────────
      # FIREBASE_SERVICE_ACCOUNT_JSON pode ser o JSON da conta de serviço em base64.
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
      # ── Google Play (assinaturas no app da loja) ────────────────────────────
      - GOOGLE_PLAY_SERVICE_ACCOUNT_JSON=${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_PLAY_PACKAGE_NAME=${GOOGLE_PLAY_PACKAGE_NAME:-com.leadsflowapi.app}
      - GOOGLE_PLAY_ACCOUNT_SECRET=${GOOGLE_PLAY_ACCOUNT_SECRET:-}
      - GOOGLE_PLAY_BUSINESS_PRODUCT_ID=${GOOGLE_PLAY_BUSINESS_PRODUCT_ID:-leadsflow_business}
      - GOOGLE_PLAY_BUSINESS_MONTHLY_BASE_PLAN_ID=${GOOGLE_PLAY_BUSINESS_MONTHLY_BASE_PLAN_ID:-monthly}
      - GOOGLE_PLAY_BUSINESS_ANNUAL_BASE_PLAN_ID=${GOOGLE_PLAY_BUSINESS_ANNUAL_BASE_PLAN_ID:-annual}
      - GOOGLE_PLAY_ENTERPRISE_PRODUCT_ID=${GOOGLE_PLAY_ENTERPRISE_PRODUCT_ID:-leadsflow_enterprise}
      - GOOGLE_PLAY_ENTERPRISE_MONTHLY_BASE_PLAN_ID=${GOOGLE_PLAY_ENTERPRISE_MONTHLY_BASE_PLAN_ID:-monthly}
      - GOOGLE_PLAY_ENTERPRISE_ANNUAL_BASE_PLAN_ID=${GOOGLE_PLAY_ENTERPRISE_ANNUAL_BASE_PLAN_ID:-annual}
      - GOOGLE_PLAY_PUBSUB_AUDIENCE=${GOOGLE_PLAY_PUBSUB_AUDIENCE:-}
      - GOOGLE_PLAY_PUBSUB_SERVICE_ACCOUNT_EMAIL=${GOOGLE_PLAY_PUBSUB_SERVICE_ACCOUNT_EMAIL:-}
      # ── Atualizações ao vivo do app (npm run release:mobile) ───────────────
      - MOBILE_RELEASE_KEY=${MOBILE_RELEASE_KEY:-}
    restart: unless-stopped
    # O processo 1 de um contentor ignora sinais enviados de dentro dele: com o init (tini)
    # o vigilante da API consegue terminá-la quando bloqueia (api/src/services/health.service.ts)
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  dashboard:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Ponte de voz: chamadas do WhatsApp Business ↔ agentes ElevenLabs (voice-bridge/).
  # Sem domínio: só a API lhe fala, pela rede interna. O áudio entra direto pelas portas UDP
  # (abrir 10000-10100/udp na firewall do servidor) e PUBLIC_IP tem de ser o IP real do servidor.
  # Nenhum serviço depende dela: se falhar, a API e o painel continuam.
  voice-bridge:
    build: ./voice-bridge
    environment:
      - PORT=8090
      - BRIDGE_TOKEN=${VOICE_BRIDGE_TOKEN:-}
      - PUBLIC_IP=${PUBLIC_IP:-}
      - RTC_PORT_MIN=10000
      - RTC_PORT_MAX=10100
      - API_CALLBACK_URL=http://api:4000/api/webhooks/voice-bridge
      - MAX_CONCURRENT_CALLS=${MAX_CONCURRENT_CALLS:-20}
    expose:
      - "8090"
    ports:
      - "10000-10100:10000-10100/udp"
    restart: unless-stopped
    init: true
